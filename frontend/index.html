<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hitesh's AI Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <main class="app">
    <header class="app-header">
      <div class="avatar">H</div>
      <div class="header-text">
        <h1>Hitesh's AI Assistant</h1>
        <p class="subtitle"><span class="status-dot"></span>Ask me anything about Hitesh</p>
      </div>
    </header>

    <div id="chat" class="chat">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">💬</div>
        <p>Start a conversation, or try one of these:</p>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button type="button" class="chip" data-prompt="Tell me about Hitesh.">Tell me about Hitesh</button>
      <button type="button" class="chip" data-prompt="Tell me about all of Hitesh's projects.">His projects</button>
      <button type="button" class="chip" data-prompt="What are Hitesh's technical skills?">Technical skills</button>
    </div>

    <form id="chat-form" class="composer">
      <textarea
        id="message"
        rows="1"
        placeholder="Ask something about Hitesh..."
        autocomplete="off"
      ></textarea>
      <button type="submit" id="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
